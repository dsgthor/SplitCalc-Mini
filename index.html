<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitCalc - Split Expenses Easily</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .slide-down { animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { max-height: 0; opacity: 0; } to { max-height: 500px; opacity: 1; } }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-indigo-800 mb-2">🧾 SplitCalc</h1>
            <p class="text-gray-600">Split expenses fairly, calculate instantly, export seamlessly</p>
        </header>

        <div class="grid lg:grid-cols-2 gap-6">
            <!-- Left Column -->
            <div class="space-y-6">
                <!-- Members Section -->
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4">👥 Members</h2>
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="memberInput" placeholder="Enter member name" 
                               class="flex-1 px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <button onclick="addMember()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition-colors">
                            Add
                        </button>
                    </div>
                    <div id="membersList" class="space-y-2"></div>
                </div>

                <!-- Add Expense Section -->
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4">➕ Add Expense</h2>
                    <form id="expenseForm" class="space-y-4">
                        <input type="text" id="expenseTitle" placeholder="Expense title (e.g., Dinner)" required
                               class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        
                        <input type="number" id="expenseAmount" placeholder="Amount" step="0.01" required
                               class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        
                        <select id="expensePaidBy" required
                                class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                            <option value="">Who paid?</option>
                        </select>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Shared with:</label>
                            <div class="flex gap-2 mb-2">
                                <button type="button" onclick="selectAllMembers()" 
                                        class="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700 transition-colors">
                                    Select All
                                </button>
                                <button type="button" onclick="deselectAllMembers()" 
                                        class="bg-gray-600 text-white px-3 py-1 rounded text-sm hover:bg-gray-700 transition-colors">
                                    Deselect All
                                </button>
                            </div>
                            <div id="sharedWithCheckboxes" class="space-y-1"></div>
                        </div>
                        
                        <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition-colors font-semibold">
                            Add Expense
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Column -->
            <div class="space-y-6">
                <!-- Balances Section -->
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-semibold text-gray-800">💰 Current Balances</h2>
                        <div class="flex gap-2">
                            <button onclick="startNewCalculation()" 
                                    class="bg-purple-600 text-white px-3 py-1 rounded text-sm hover:bg-purple-700 transition-colors">
                                New Calculation
                            </button>
                            <button onclick="toggleCalculations()" id="calcToggle"
                                    class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700 transition-colors">
                                Show Calculations
                            </button>
                        </div>
                    </div>
                    <div id="balancesList" class="space-y-2"></div>
                    <div id="calculationsSection" class="mt-4 p-4 bg-gray-50 rounded-lg hidden slide-down">
                        <h3 class="font-semibold text-gray-700 mb-3">📊 Complete Calculation Breakdown:</h3>
                        <div id="calculationsDetails" class="text-sm text-gray-600 space-y-2"></div>
                    </div>
                </div>

                <!-- History Section -->
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-semibold text-gray-800">📜 Expense History</h2>
                        <button onclick="clearAllHistory()" 
                                class="bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-700 transition-colors">
                            Clear All
                        </button>
                    </div>
                    <div id="expenseHistory" class="space-y-2 max-h-60 overflow-y-auto"></div>
                </div>

                <!-- Calculation History -->
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4">🔄 Calculation History</h2>
                    <div id="calculationHistory" class="space-y-3"></div>
                </div>

                <!-- Export/Import Section -->
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4">📥📤 Data Management</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="exportData()" 
                                class="bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition-colors">
                            📥 Export JSON
                        </button>
                        <label class="bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors cursor-pointer text-center">
                            📤 Import JSON
                            <input type="file" id="importFile" accept=".json" onchange="importData()" class="hidden">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let appState = {
            members: [],
            expenses: [],
            calculationHistory: [],
            currentCalculationId: Date.now()
        };

        let showCalculations = false;

        // Initialize app
        function init() {
            loadFromStorage();
            updateUI();
        }

        // Storage functions
        function saveToStorage() {
            localStorage.setItem('splitcalc_data', JSON.stringify(appState));
        }

        function loadFromStorage() {
            const stored = localStorage.getItem('splitcalc_data');
            if (stored) {
                appState = JSON.parse(stored);
            }
        }

        // Member management
        function addMember() {
            const input = document.getElementById('memberInput');
            const name = input.value.trim();
            
            if (name && !appState.members.includes(name)) {
                appState.members.push(name);
                input.value = '';
                updateUI();
                saveToStorage();
            }
        }

        function removeMember(name) {
            appState.members = appState.members.filter(m => m !== name);
            appState.expenses = appState.expenses.filter(e => e.paidBy !== name && !e.sharedWith.includes(name));
            updateUI();
            saveToStorage();
        }

        // Expense management
        function addExpense(event) {
            event.preventDefault();
            
            const title = document.getElementById('expenseTitle').value.trim();
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const paidBy = document.getElementById('expensePaidBy').value;
            const sharedWith = Array.from(document.querySelectorAll('input[name="sharedWith"]:checked')).map(cb => cb.value);
            
            if (title && amount > 0 && paidBy && sharedWith.length > 0) {
                const expense = {
                    id: Date.now(),
                    title,
                    amount,
                    paidBy,
                    sharedWith,
                    date: new Date().toISOString()
                };
                
                appState.expenses.push(expense);
                document.getElementById('expenseForm').reset();
                
                // Save calculation to history
                saveCalculationToHistory();
                
                updateUI();
                saveToStorage();
            }
        }

        function removeExpense(expenseId) {
            appState.expenses = appState.expenses.filter(e => e.id !== expenseId);
            saveCalculationToHistory();
            updateUI();
            saveToStorage();
        }

        // Calculation functions
        function calculateBalances() {
            const balances = {};
            const detailedCalculations = [];
            
            // Initialize balances
            appState.members.forEach(member => {
                balances[member] = 0;
            });
            
            if (appState.expenses.length === 0) {
                return { balances, detailedCalculations };
            }
            
            detailedCalculations.push("=== EXPENSE BREAKDOWN ===");
            
            // Process each expense
            appState.expenses.forEach((expense, index) => {
                const share = expense.amount / expense.sharedWith.length;
                
                detailedCalculations.push(`\n${index + 1}. ${expense.title}:`);
                detailedCalculations.push(`   Total Amount: ₹${expense.amount}`);
                detailedCalculations.push(`   Paid by: ${expense.paidBy}`);
                detailedCalculations.push(`   Shared among: ${expense.sharedWith.join(', ')} (${expense.sharedWith.length} people)`);
                detailedCalculations.push(`   Per person share: ₹${expense.amount} ÷ ${expense.sharedWith.length} = ₹${share.toFixed(2)}`);
                
                // Payer gets credit for the full amount
                balances[expense.paidBy] += expense.amount;
                detailedCalculations.push(`   → ${expense.paidBy} gets credit: +₹${expense.amount}`);
                
                // Everyone who shared pays their share
                expense.sharedWith.forEach(person => {
                    balances[person] -= share;
                    detailedCalculations.push(`   → ${person} owes their share: -₹${share.toFixed(2)}`);
                });
            });
            
            // Show running balances
            detailedCalculations.push("\n=== RUNNING BALANCES ===");
            Object.entries(balances).forEach(([person, balance]) => {
                if (Math.abs(balance) > 0.01) {
                    const status = balance > 0 ? `should receive ₹${balance.toFixed(2)}` : `owes ₹${Math.abs(balance).toFixed(2)}`;
                    detailedCalculations.push(`${person}: ${status}`);
                } else {
                    detailedCalculations.push(`${person}: All settled (₹0.00)`);
                }
            });
            
            // Show final settlements
            const settlements = getSettlements(balances);
            if (settlements.length > 0) {
                detailedCalculations.push("\n=== FINAL SETTLEMENTS ===");
                settlements.forEach(settlement => {
                    detailedCalculations.push(`${settlement.from} pays ${settlement.to}: ₹${settlement.amount.toFixed(2)}`);
                });
                
                // Show verification
                detailedCalculations.push("\n=== VERIFICATION ===");
                detailedCalculations.push("After settlements, everyone's balance will be ₹0.00");
            } else {
                detailedCalculations.push("\n=== FINAL RESULT ===");
                detailedCalculations.push("Everyone is already settled! No payments needed.");
            }
            
            return { balances, detailedCalculations };
        }

        function getSettlements(balances) {
            const settlements = [];
            const creditors = [];
            const debtors = [];
            
            Object.entries(balances).forEach(([person, balance]) => {
                if (balance > 0.01) {
                    creditors.push({ person, amount: balance });
                } else if (balance < -0.01) {
                    debtors.push({ person, amount: -balance });
                }
            });
            
            // Simple settlement algorithm
            creditors.forEach(creditor => {
                debtors.forEach(debtor => {
                    if (creditor.amount > 0.01 && debtor.amount > 0.01) {
                        const settlement = Math.min(creditor.amount, debtor.amount);
                        settlements.push({
                            from: debtor.person,
                            to: creditor.person,
                            amount: settlement
                        });
                        creditor.amount -= settlement;
                        debtor.amount -= settlement;
                    }
                });
            });
            
            return settlements;
        }

        // History management
        function saveCalculationToHistory() {
            if (appState.expenses.length === 0) return;
            
            const timestamp = new Date().toLocaleString();
            const { balances } = calculateBalances();
            const settlements = getSettlements(balances);
            
            // Calculate total expenses for this calculation
            const totalExpenses = appState.expenses.reduce((sum, exp) => sum + exp.amount, 0);
            
            const calculation = {
                id: appState.currentCalculationId,
                timestamp,
                members: [...appState.members],
                expenses: [...appState.expenses],
                totalAmount: totalExpenses,
                settlements: [...settlements],
                expenseCount: appState.expenses.length
            };
            
            // Remove existing calculation with same ID (update scenario)
            appState.calculationHistory = appState.calculationHistory.filter(c => c.id !== appState.currentCalculationId);
            
            appState.calculationHistory.unshift(calculation);
            
            // Keep only last 3 calculations
            if (appState.calculationHistory.length > 3) {
                appState.calculationHistory = appState.calculationHistory.slice(0, 3);
            }
        }

        function startNewCalculation() {
            if (appState.expenses.length > 0 || appState.members.length > 0) {
                if (confirm('Start a completely new calculation? Current members and expenses will be saved to history and cleared.')) {
                    // Save current state to history if there are expenses
                    if (appState.expenses.length > 0) {
                        saveCalculationToHistory();
                    }
                    
                    // Reset everything
                    appState.members = [];
                    appState.expenses = [];
                    appState.currentCalculationId = Date.now();
                    
                    updateUI();
                    saveToStorage();
                    
                    alert('New calculation started! Previous data saved to history.');
                }
            } else {
                alert('Already starting fresh! Add some members and expenses.');
            }
        }

        function restoreCalculation(calcId) {
            const calc = appState.calculationHistory.find(c => c.id === calcId);
            if (!calc) return;
            
            if (confirm('Restore this calculation? Current data will be replaced.')) {
                // Save current state if there's data
                if (appState.expenses.length > 0) {
                    saveCalculationToHistory();
                }
                
                // Restore the selected calculation
                appState.members = [...calc.members];
                appState.expenses = [...calc.expenses];
                appState.currentCalculationId = calc.id;
                
                updateUI();
                saveToStorage();
                
                alert('Calculation restored successfully!');
            }
        }

        function downloadCalculation(calcId) {
            const calc = appState.calculationHistory.find(c => c.id === calcId);
            if (!calc) return;
            
            const exportData = {
                timestamp: calc.timestamp,
                members: calc.members,
                expenses: calc.expenses,
                settlements: calc.settlements,
                totalAmount: calc.totalAmount,
                summary: {
                    expenseCount: calc.expenseCount,
                    memberCount: calc.members.length,
                    totalAmount: calc.totalAmount
                }
            };
            
            const dataStr = JSON.stringify(exportData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            
            // Create filename from timestamp
            const dateStr = new Date(calc.timestamp).toISOString().split('T')[0];
            const timeStr = new Date(calc.timestamp).toTimeString().split(' ')[0].replace(/:/g, '-');
            link.download = `splitcalc_calculation_${dateStr}_${timeStr}.json`;
            
            link.click();
            URL.revokeObjectURL(url);
        }

        function removeCalculationFromHistory(calcId) {
            appState.calculationHistory = appState.calculationHistory.filter(c => c.id !== calcId);
            updateUI();
            saveToStorage();
        }

        function clearAllHistory() {
            if (confirm('Are you sure you want to clear all history?')) {
                appState.calculationHistory = [];
                updateUI();
                saveToStorage();
            }
        }

        // UI functions
        function selectAllMembers() {
            document.querySelectorAll('input[name="sharedWith"]').forEach(cb => cb.checked = true);
        }

        function deselectAllMembers() {
            document.querySelectorAll('input[name="sharedWith"]').forEach(cb => cb.checked = false);
        }

        function toggleCalculations() {
            showCalculations = !showCalculations;
            const section = document.getElementById('calculationsSection');
            const button = document.getElementById('calcToggle');
            
            if (showCalculations) {
                section.classList.remove('hidden');
                button.textContent = 'Hide Calculations';
            } else {
                section.classList.add('hidden');
                button.textContent = 'Show Calculations';
            }
        }

        // Export/Import functions
        function exportData() {
            const dataStr = JSON.stringify(appState, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `splitcalc_export_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importData() {
            const file = document.getElementById('importFile').files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    // Check if it's a full app export or individual calculation
                    if (importedData.members && importedData.expenses && importedData.calculationHistory !== undefined) {
                        // Full app export
                        if (confirm('This will replace ALL current data with imported data. Continue?')) {
                            appState = importedData;
                            if (!appState.currentCalculationId) {
                                appState.currentCalculationId = Date.now();
                            }
                            updateUI();
                            saveToStorage();
                            alert('Full app data imported successfully!');
                        }
                    } else if (importedData.members && importedData.expenses) {
                        // Individual calculation import
                        if (confirm('Import this calculation? Current data will be replaced.')) {
                            // Save current state if there's data
                            if (appState.expenses.length > 0) {
                                saveCalculationToHistory();
                            }
                            
                            appState.members = importedData.members || [];
                            appState.expenses = importedData.expenses || [];
                            appState.currentCalculationId = Date.now();
                            
                            updateUI();
                            saveToStorage();
                            alert('Individual calculation imported successfully!');
                        }
                    } else {
                        alert('Invalid file format! Please import a valid SplitCalc JSON file.');
                    }
                } catch (error) {
                    alert('Error reading file! Please check the file format.');
                }
            };
            reader.readAsText(file);
        }

        // Main UI update function
        function updateUI() {
            updateMembersList();
            updateExpenseForm();
            updateBalances();
            updateExpenseHistory();
            updateCalculationHistory();
        }

        function updateMembersList() {
            const container = document.getElementById('membersList');
            container.innerHTML = '';
            
            appState.members.forEach(member => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-2 bg-gray-50 rounded fade-in';
                div.innerHTML = `
                    <span class="font-medium">${member}</span>
                    <button onclick="removeMember('${member}')" class="text-red-600 hover:text-red-800">×</button>
                `;
                container.appendChild(div);
            });
        }

        function updateExpenseForm() {
            const paidBySelect = document.getElementById('expensePaidBy');
            const sharedWithContainer = document.getElementById('sharedWithCheckboxes');
            
            // Update paid by dropdown
            paidBySelect.innerHTML = '<option value="">Who paid?</option>';
            appState.members.forEach(member => {
                paidBySelect.innerHTML += `<option value="${member}">${member}</option>`;
            });
            
            // Update shared with checkboxes
            sharedWithContainer.innerHTML = '';
            appState.members.forEach(member => {
                const div = document.createElement('div');
                div.className = 'flex items-center';
                div.innerHTML = `
                    <input type="checkbox" name="sharedWith" value="${member}" id="share_${member}" class="mr-2">
                    <label for="share_${member}" class="text-sm">${member}</label>
                `;
                sharedWithContainer.appendChild(div);
            });
        }

        function updateBalances() {
            const { balances, detailedCalculations } = calculateBalances();
            const settlements = getSettlements(balances);
            
            const balancesContainer = document.getElementById('balancesList');
            const calculationsContainer = document.getElementById('calculationsDetails');
            
            balancesContainer.innerHTML = '';
            
            if (appState.expenses.length === 0) {
                balancesContainer.innerHTML = '<p class="text-gray-500 text-center">Add expenses to see balances</p>';
                calculationsContainer.innerHTML = '<p class="text-gray-500">No calculations yet</p>';
                return;
            }
            
            if (settlements.length === 0) {
                balancesContainer.innerHTML = '<div class="p-3 bg-green-50 border border-green-200 rounded-lg text-center"><span class="text-green-700 font-medium">🎉 Everyone is settled! No payments needed.</span></div>';
            } else {
                settlements.forEach(settlement => {
                    const div = document.createElement('div');
                    div.className = 'p-3 bg-yellow-50 border border-yellow-200 rounded-lg fade-in';
                    div.innerHTML = `
                        <span class="font-medium">${settlement.from}</span> owes 
                        <span class="font-medium">${settlement.to}</span> 
                        <span class="font-bold text-green-600">₹${settlement.amount.toFixed(2)}</span>
                    `;
                    balancesContainer.appendChild(div);
                });
            }
            
            // Update detailed calculations
            calculationsContainer.innerHTML = detailedCalculations.map(calc => {
                if (calc.startsWith('===')) {
                    return `<div class="font-bold text-indigo-700 mt-3 mb-1">${calc}</div>`;
                } else if (calc.startsWith('\n')) {
                    return `<div class="font-semibold text-gray-800 mt-2">${calc.substring(1)}</div>`;
                } else if (calc.includes('→')) {
                    return `<div class="ml-4 text-blue-600">${calc}</div>`;
                } else {
                    return `<div class="ml-2">${calc}</div>`;
                }
            }).join('');
        }

        function updateExpenseHistory() {
            const container = document.getElementById('expenseHistory');
            container.innerHTML = '';
            
            if (appState.expenses.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center">No expenses yet</p>';
                return;
            }
            
            appState.expenses.slice().reverse().forEach(expense => {
                const div = document.createElement('div');
                div.className = 'p-3 bg-gray-50 rounded-lg fade-in';
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-medium">${expense.title}</div>
                            <div class="text-sm text-gray-600">₹${expense.amount} paid by ${expense.paidBy}</div>
                            <div class="text-xs text-gray-500">Shared with: ${expense.sharedWith.join(', ')}</div>
                        </div>
                        <button onclick="removeExpense(${expense.id})" class="text-red-600 hover:text-red-800">×</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function updateCalculationHistory() {
            const container = document.getElementById('calculationHistory');
            container.innerHTML = '';
            
            if (appState.calculationHistory.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center">No calculation history</p>';
                return;
            }
            
            appState.calculationHistory.forEach(calc => {
                const div = document.createElement('div');
                div.className = 'p-4 bg-blue-50 border border-blue-200 rounded-lg fade-in';
                
                const settlementsHtml = calc.settlements.length === 0 
                    ? '<div class="text-green-600 font-medium">✅ All settled!</div>' 
                    : calc.settlements.map(s => 
                        `<div class="text-sm">${s.from} → ${s.to}: <span class="font-medium text-green-600">₹${s.amount.toFixed(2)}</span></div>`
                      ).join('');
                
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex-1">
                            <div class="text-sm font-bold text-indigo-800">${calc.timestamp}</div>
                            <div class="text-xs text-gray-600 mt-1">
                                ${calc.expenseCount} expenses • ${calc.members.length} members • Total: ₹${calc.totalAmount.toFixed(2)}
                            </div>
                        </div>
                        <div class="flex gap-1 ml-2">
                            <button onclick="restoreCalculation(${calc.id})" 
                                    class="bg-green-600 text-white px-2 py-1 rounded text-xs hover:bg-green-700 transition-colors"
                                    title="Restore this calculation">
                                📂
                            </button>
                            <button onclick="downloadCalculation(${calc.id})" 
                                    class="bg-blue-600 text-white px-2 py-1 rounded text-xs hover:bg-blue-700 transition-colors"
                                    title="Download this calculation">
                                💾
                            </button>
                            <button onclick="removeCalculationFromHistory(${calc.id})" 
                                    class="bg-red-600 text-white px-2 py-1 rounded text-xs hover:bg-red-700 transition-colors"
                                    title="Delete this calculation">
                                🗑️
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-2">
                        <div class="text-xs font-semibold text-gray-700 mb-1">Members: ${calc.members.join(', ')}</div>
                        <div class="text-xs text-gray-600 mb-2">
                            Expenses: ${calc.expenses.map(e => `${e.title} (₹${e.amount})`).join(' • ')}
                        </div>
                    </div>
                    
                    <div class="border-t pt-2">
                        <div class="text-xs font-semibold text-gray-700 mb-1">Final Settlements:</div>
                        ${settlementsHtml}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Event listeners
        document.getElementById('memberInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addMember();
            }
        });

        document.getElementById('expenseForm').addEventListener('submit', addExpense);

        // Initialize app
        init();
    </script>
</body>
</html>
